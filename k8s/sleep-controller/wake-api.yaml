# 잠든 Qwen 파드는 NotReady라서 일반 Service(vllm-qwen)의 엔드포인트에서 빠진다.
# 관리 요청(/sleep, /wake_up, /is_sleeping)은 NotReady 파드도 돌려주는 이 헤드리스 Service로 보낸다.
apiVersion: v1
kind: Service
metadata:
  name: vllm-qwen-admin
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: vllm-qwen
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: qwen-wake-api
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: qwen-wake-api
  labels:
    app.kubernetes.io/name: qwen-wake-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: qwen-wake-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: qwen-wake-api
    spec:
      serviceAccountName: qwen-wake-api
      automountServiceAccountToken: false
      nodeSelector:
        karpenter.sh/nodepool: system
      # 이 API가 멈추면 BFF가 잠든 Qwen을 깨울 수 없다. 복제본을 AZ별로 나눈다.
      topologySpreadConstraints:
        - maxSkew: 1
          minDomains: 2
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: qwen-wake-api
          matchLabelKeys:
            - pod-template-hash
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: wake-api
          image: public.ecr.aws/docker/library/python:3.13-slim@sha256:e48f59cdba69a3cbd9ed2cf0f348d90d45a8d350d98134cf1070bc106ee9ed90
          command: ["python3", "/scripts/wake-api.py"]
          env:
            - name: QWEN_ADMIN_URL
              value: http://vllm-qwen-admin.inference.svc:8000
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
          volumeMounts:
            - name: scripts
              mountPath: /scripts
              readOnly: true
      volumes:
        - name: scripts
          configMap:
            name: sleep-controller-scripts
---
# ClusterIP로만 노출한다. HTTPRoute에 등록하지 않으므로 게이트웨이로는 닿지 않는다.
apiVersion: v1
kind: Service
metadata:
  name: qwen-wake-api
  labels:
    app.kubernetes.io/name: qwen-wake-api
spec:
  selector:
    app.kubernetes.io/name: qwen-wake-api
  ports:
    - name: http
      port: 8080
      targetPort: http
