apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# 도쿄. 수집기 설정(prometheus.yml)만 도쿄의 것으로 바꾼다. 이 파일은 작업 공간 ID가 들어 있어 추적하지 않는다.
# k8s/observability/prometheus.yml.example에서 리전, 작업 공간 ID, cluster 라벨을 바꿔 만든다(docs/onboarding.md).
resources:
  - ../../../observability

configMapGenerator:
  - name: metrics-collector
    namespace: monitoring
    behavior: replace
    files:
      - prometheus.yml
