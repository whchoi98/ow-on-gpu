apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# 도쿄. k8s/gateway에서 NLB의 보안 그룹 이름만 바꾼다(infra/terraform/app.tf가 <클러스터>-gateway-nlb로 만든다).
# k8s/gateway/install.sh가 TF_WORKSPACE=tokyo일 때 k8s/gateway 대신 이 디렉터리를 적용한다.
resources:
  - ../../../gateway

patches:
  - target:
      kind: AgentgatewayParameters
      name: inference-gateway
    patch: |-
      - op: replace
        path: /spec/service/metadata/annotations/service.beta.kubernetes.io~1aws-load-balancer-security-groups
        value: ow-on-gpu-tokyo-gateway-nlb
