# 게이트웨이의 /decide를 Decider 서버의 /v1/systemone으로 보낸다. InferencePool로 묶지 않고 Service로 직접 간다.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: decider
spec:
  parentRefs:
    - name: inference-gateway
  rules:
    - matches:
        - path:
            type: Exact
            value: /decide
          method: POST
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplaceFullPath
              replaceFullPath: /v1/systemone
      backendRefs:
        - name: decider
          port: 8080
      timeouts:
        request: 30s
