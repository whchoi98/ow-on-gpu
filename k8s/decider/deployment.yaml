# 서빙 방식은 strands-labs/strands-decider 저장소의 deploy/sagemaker를 따른다.
# - 이미지: 저장소의 deploy/sagemaker/Dockerfile로 빌드한 이미지(install.sh build). 저장소가 안내하는 공개 컨테이너는
#   2026-11-20 빌드까지 strands-decider 0.3.1.dev1이어서 v2 체크포인트를 읽지 못한다.
#   안에서 `strands-decider serve --host 0.0.0.0 --port 8080`이 실행된다.
#   이미지 주소에 계정 ID가 들어가므로 ${DECIDER_IMAGE} 자리는 install.sh가 채운다. kubectl apply -k로 직접 적용하지 않는다.
# - 모델 배치: scripts/fetch-model.ts와 같게 /opt/ml/model/<모델 이름>/에 둔다. v2 체크포인트(decision_config.json)는
#   가중치를 모두 담고 있어 기반 모델을 따로 두지 않는다. HF_HUB_OFFLINE=1이라 Hugging Face에 접근하지 않는다.
# - 예열: 서버가 요청을 받기 전에 질문 종류별로 한 번씩 스스로 실행하고, 끝날 때까지 /health가 실패한다.
#
# infra/terraform/storage.tf가 이 ServiceAccount에 S3 읽기 전용 역할을 Pod Identity로 연결한다.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: decider
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: decider
  labels:
    app.kubernetes.io/name: decider
spec:
  replicas: 1
  # GPU 1장에 파드 1개이므로 새 파드를 띄우기 전에 기존 파드를 내린다.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: decider
  template:
    metadata:
      labels:
        app.kubernetes.io/name: decider
      # 자동 계측을 받지 않는다. amazon-cloudwatch-observability 애드온의 웹훅이 파드 템플릿이 바뀌는 Deployment에
      # inject-*: "true"를 붙여 계측 init 컨테이너와 환경 변수를 넣는다(k8s/bff/bff.yaml과 같은 이유).
      annotations:
        instrumentation.opentelemetry.io/inject-python: "false"
        instrumentation.opentelemetry.io/inject-java: "false"
        instrumentation.opentelemetry.io/inject-nodejs: "false"
        instrumentation.opentelemetry.io/inject-dotnet: "false"
    spec:
      serviceAccountName: decider
      automountServiceAccountToken: false
      nodeSelector:
        karpenter.sh/nodepool: decider
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      initContainers:
        - name: model-fetch
          image: public.ecr.aws/aws-cli/aws-cli:2.40.3
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              MODEL=strands-decider-12B-gemma4-v2-2611
              aws s3 sync "s3://$MODEL_BUCKET/models/$MODEL/" "/opt/ml/model/$MODEL/" --only-show-errors
              du -sh /opt/ml/model/*
          env:
            - name: MODEL_BUCKET
              valueFrom:
                configMapKeyRef: {name: platform, key: MODEL_BUCKET}
            - name: AWS_DEFAULT_REGION
              valueFrom:
                configMapKeyRef: {name: platform, key: AWS_REGION}
          volumeMounts:
            - name: model
              mountPath: /opt/ml/model
      containers:
        - name: decider
          image: ${DECIDER_IMAGE}
          env:
            - name: DECIDER_CHECKPOINT
              value: /opt/ml/model/strands-decider-12B-gemma4-v2-2611
          ports:
            - name: http
              containerPort: 8080
          resources:
            # 가중치 크기(24GB)에 맞춰 잡은 값이다. 측정한 최대 사용량은 13.4GiB였고 대부분 가중치 파일의 페이지 캐시다
            # (docs/05-decider.md). 노드를 Decider가 혼자 쓰므로 낮추지 않았다.
            requests:
              cpu: "2"
              memory: 24Gi
            limits:
              memory: 28Gi
              nvidia.com/gpu: 1
          # /health는 예열이 끝난 뒤에야 성공한다.
          startupProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 1
            failureThreshold: 900
          readinessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 2
          livenessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 10
            failureThreshold: 3
          volumeMounts:
            - name: model
              mountPath: /opt/ml/model
      volumes:
        - name: model
          emptyDir: {}
