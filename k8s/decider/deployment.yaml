# 서빙 방식은 strands-labs/strands-decider 저장소의 deploy/sagemaker를 따른다.
# - 이미지: 저장소가 안내하는 공개 컨테이너. 안에서 `strands-decider serve --host 0.0.0.0 --port 8080`이 실행된다.
# - 모델 배치: scripts/fetch-model.ts와 같게 /opt/ml/model/<모델 이름>/과 /opt/ml/model/base/에 두고,
#   strands_decider_config.json의 base_model을 로컬 경로로 바꾼다. HF_HUB_OFFLINE=1이라 Hugging Face에 접근하지 않는다.
# - 예열: 서버가 요청을 받기 전에 질문 종류별로 한 번씩 스스로 실행하고, 끝날 때까지 /health가 실패한다.
#
# infra/terraform/storage.tf가 이 ServiceAccount에 S3 읽기 전용 역할을 Pod Identity로 연결한다.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: decider
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: decider
  labels:
    app.kubernetes.io/name: decider
spec:
  replicas: 1
  # GPU 1장에 파드 1개이므로 새 파드를 띄우기 전에 기존 파드를 내린다.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: decider
  template:
    metadata:
      labels:
        app.kubernetes.io/name: decider
    spec:
      serviceAccountName: decider
      automountServiceAccountToken: false
      nodeSelector:
        karpenter.sh/nodepool: decider
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      initContainers:
        - name: model-fetch
          image: public.ecr.aws/aws-cli/aws-cli:2.40.3
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              MODEL=strands-decider-2B-qwen3.5-v1-2610
              aws s3 sync "s3://$MODEL_BUCKET/models/$MODEL/" "/opt/ml/model/$MODEL/" --only-show-errors
              aws s3 sync "s3://$MODEL_BUCKET/models/Qwen3.5-2B-Base/" /opt/ml/model/base/ --only-show-errors
              sed -i 's#"base_model": *"[^"]*"#"base_model": "/opt/ml/model/base"#' "/opt/ml/model/$MODEL/strands_decider_config.json"
              grep '"base_model"' "/opt/ml/model/$MODEL/strands_decider_config.json"
              du -sh /opt/ml/model/*
          env:
            - name: MODEL_BUCKET
              valueFrom:
                configMapKeyRef: {name: platform, key: MODEL_BUCKET}
            - name: AWS_DEFAULT_REGION
              valueFrom:
                configMapKeyRef: {name: platform, key: AWS_REGION}
          volumeMounts:
            - name: model
              mountPath: /opt/ml/model
      containers:
        - name: decider
          # 태그 serve-sagemaker-cuda-v1은 매주 다시 빌드된다. 2026-11-13 빌드(strands-decider 0.3.1.dev1)로 고정한다.
          image: 763104351884.dkr.ecr.ap-northeast-2.amazonaws.com/strands-decider@sha256:c11c41913c586c98635f1aa7e9c5bcfb0e588292674f34858c825805f2bf7987
          env:
            - name: DECIDER_CHECKPOINT
              value: /opt/ml/model/strands-decider-2B-qwen3.5-v1-2610
            # 이미지 기본값과 같다. 요청 하나의 질문들은 이미 GPU에서 한 번에 처리된다.
            - name: DECIDER_MAX_CONCURRENCY
              value: "1"
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: "2"
              memory: 8Gi
            limits:
              memory: 12Gi
              nvidia.com/gpu: 1
          # /health는 예열이 끝난 뒤에야 성공한다.
          startupProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 1
            failureThreshold: 900
          readinessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 2
          livenessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 10
            failureThreshold: 3
          volumeMounts:
            - name: model
              mountPath: /opt/ml/model
      volumes:
        - name: model
          emptyDir: {}
