---
# 게이트웨이, EPP, 적재 Job용 CPU 노드. AZ 분산은 NodePool이 아닌 각 워크로드의
# topologySpreadConstraints로 건다. NodePool은 네 AZ를 모두 허용한다.
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: system
spec:
  template:
    spec:
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: system
      requirements:
        - key: kubernetes.io/arch
          operator: In
          values: ["amd64"]
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["on-demand"]
        - key: karpenter.k8s.aws/instance-category
          operator: In
          values: ["c", "m"]
        - key: karpenter.k8s.aws/instance-generation
          operator: Gt
          values: ["6"]
        - key: karpenter.k8s.aws/instance-cpu
          operator: In
          values: ["4", "8"]
  limits:
    cpu: "32"
  disruption:
    consolidationPolicy: WhenEmpty
    consolidateAfter: 30m
