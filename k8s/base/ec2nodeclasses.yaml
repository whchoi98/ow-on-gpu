# 공통 사항
# - role은 infra/terraform의 Karpenter CloudFormation 스택이 만든다(KarpenterNodeRole-<클러스터>).
# - 서브넷과 보안 그룹은 Terraform이 붙인 karpenter.sh/discovery 태그로 고른다.
# - AMI는 별칭으로 고정한다. 별칭을 쓰면 Karpenter가 GPU 인스턴스에 NVIDIA 변형 AMI를 고른다.
apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: system
spec:
  role: KarpenterNodeRole-ow-on-gpu
  amiSelectorTerms:
    - alias: al2023@v20261107
  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: ow-on-gpu
  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: ow-on-gpu
---
# Decider용. 로컬 NVMe를 RAID0으로 묶어 kubelet과 containerd가 쓰게 한다.
apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: gpu
spec:
  role: KarpenterNodeRole-ow-on-gpu
  amiSelectorTerms:
    - alias: al2023@v20261107
  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: ow-on-gpu
  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: ow-on-gpu
  instanceStorePolicy: RAID0
---
# Gemma와 Qwen용. gpu와 같고 vLLM 이미지를 미리 받는다.
apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: vllm
spec:
  role: KarpenterNodeRole-ow-on-gpu
  amiSelectorTerms:
    - alias: al2023@v20261107
  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: ow-on-gpu
  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: ow-on-gpu
  instanceStorePolicy: RAID0
  # 사용자 스크립트는 containerd가 뜨기 전에 실행될 수 있어서, containerd를 기다렸다가 받는
  # 일회성 유닛으로 넘긴다. 노드 등록을 막지 않고 kubelet과 나란히 진행된다.
  # 2026-11-14 첫 GPU 노드에서 확인: containerd가 뜬 직후부터 108.7초에 받았고(9.1GiB),
  # kubelet의 pull은 진행 중인 다운로드를 이어받아 사전 pull이 끝난 1초 뒤에 끝났다.
  userData: |
    MIME-Version: 1.0
    Content-Type: multipart/mixed; boundary="BOUNDARY"

    --BOUNDARY
    Content-Type: text/x-shellscript; charset="us-ascii"

    #!/bin/bash
    systemd-run --unit=prepull-vllm --no-block /bin/bash -c '
      until ctr --namespace k8s.io version >/dev/null 2>&1; do sleep 1; done
      ctr --namespace k8s.io images pull docker.io/vllm/vllm-openai:v0.33.0
    '
    --BOUNDARY--
