# BFF를 EKS 파드로 실행한다. 이전에는 ECS Fargate 태스크였다(docs/07-bff.md).
# ${...} 자리는 install.sh가 Terraform 출력에서 읽은 값으로 채운다. 계정 ID가 든 이미지 주소를 이 파일에 적지 않기 위해서다.
apiVersion: v1
kind: Namespace
metadata:
  name: app
  labels:
    # AWS Load Balancer Controller가 파드에 readiness gate를 넣는다. 새 파드는 ALB 대상 그룹에서 healthy가 된 뒤에 Ready가 된다.
    elbv2.k8s.aws/pod-readiness-gate-inject: enabled
---
# EKS Pod Identity로 웹 검색 권한(bedrock-agentcore:InvokeWebSearch)만 가진 역할을 받는다(infra/terraform/bff_eks.tf).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: bff
  namespace: app
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: bff
  namespace: app
data:
  # 클러스터 안에서는 NLB가 아닌 Service로 부른다.
  GATEWAY_URL: http://inference-gateway.inference.svc.cluster.local
  WAKE_API_URL: http://qwen-wake-api.inference.svc.cluster.local:8080
  COGNITO_ISSUER: ${COGNITO_ISSUER}
  COGNITO_CLIENT_ID: ${COGNITO_CLIENT_ID}
  # Decider의 신뢰도가 이 값보다 낮으면 기본 처리(Gemma, thinking 끔, 민감)로 넘긴다.
  # 웹 검색 리전은 infra/terraform의 web_search_region과 같아야 한다. IAM 정책이 그 리전의 도구만 허용한다.
  DECIDER_MIN_CONFIDENCE: "0.6"
  WEB_SEARCH_REGION: us-east-1
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bff
  namespace: app
  labels:
    app.kubernetes.io/name: bff
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: bff
  strategy:
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bff
      # 자동 계측을 받지 않는다. 2026-11-16에 이 클러스터에 amazon-cloudwatch-observability 애드온이 설치된 뒤로,
      # 그 웹훅이 파드 템플릿이 바뀌는 Deployment에 inject-*: "true"를 붙여 계측 init 컨테이너와 환경 변수를 넣는다.
      # 요청 경로의 조건을 측정 때와 같게 두려고 거부를 명시한다. 값이 적혀 있으면 웹훅이 바꾸지 않는다.
      annotations:
        instrumentation.opentelemetry.io/inject-python: "false"
        instrumentation.opentelemetry.io/inject-java: "false"
        instrumentation.opentelemetry.io/inject-nodejs: "false"
        instrumentation.opentelemetry.io/inject-dotnet: "false"
    spec:
      serviceAccountName: bff
      nodeSelector:
        karpenter.sh/nodepool: app
      tolerations:
        - key: ow-on-gpu/app
          operator: Exists
          effect: NoSchedule
      # 파드 2개를 AZ 두 곳에 나눈다. minDomains와 matchLabelKeys가 없으면 게이트웨이 때처럼 한 AZ에 몰릴 수 있다(docs/04-gateway.md).
      topologySpreadConstraints:
        - maxSkew: 1
          minDomains: 2
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: bff
          matchLabelKeys: ["pod-template-hash"]
      # 스트리밍 중인 응답이 끝날 시간을 준다. 먼저 15초 동안 ALB가 대상에서 빼기를 기다린 뒤 종료 신호를 받는다.
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: bff
          image: ${BFF_IMAGE}
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: bff
          # Fargate 태스크는 0.5 vCPU, 1GB였다. 같은 크기를 요청한다.
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              memory: 1Gi
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
            failureThreshold: 3
          lifecycle:
            preStop:
              sleep:
                seconds: 15
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: bff
  namespace: app
spec:
  selector:
    app.kubernetes.io/name: bff
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: bff
  namespace: app
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: bff
---
# 내부 ALB는 AWS Load Balancer Controller가 이 Ingress에서 만든다. CloudFront의 VPC origin이 이 ALB를 가리킨다.
# - 보안 그룹은 Terraform이 만든 ow-on-gpu-bff-alb를 쓴다(Name 태그로 찾는다). CloudFront VPC origin의 보안 그룹에서 오는 80만 받는다.
# - manage-backend-security-group-rules: 컨트롤러가 공용 백엔드 보안 그룹을 ALB에 더 붙이고, 노드의 보안 그룹에 그 그룹에서 오는 8080을 연다.
# - 서브넷은 적지 않는다. 컨트롤러가 이 VPC에서 kubernetes.io/role/internal-elb 태그가 붙은 Private 서브넷을 AZ마다 하나씩 고른다.
# - 타임아웃, 접근 로그, 쿠키 고정은 Terraform으로 만든 ALB와 같은 값이다(docs/07-bff.md의 타임아웃 표).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: bff
  namespace: app
  annotations:
    alb.ingress.kubernetes.io/load-balancer-name: ow-on-gpu-bff-pods
    alb.ingress.kubernetes.io/scheme: internal
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}]'
    alb.ingress.kubernetes.io/security-groups: ow-on-gpu-bff-alb
    alb.ingress.kubernetes.io/manage-backend-security-group-rules: "true"
    alb.ingress.kubernetes.io/healthcheck-path: /healthz
    alb.ingress.kubernetes.io/load-balancer-attributes: idle_timeout.timeout_seconds=120,access_logs.s3.enabled=true,access_logs.s3.bucket=${ALB_LOG_BUCKET},access_logs.s3.prefix=bff
    alb.ingress.kubernetes.io/target-group-attributes: deregistration_delay.timeout_seconds=30,stickiness.enabled=true,stickiness.type=lb_cookie,stickiness.lb_cookie.duration_seconds=1800
spec:
  ingressClassName: alb
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: bff
                port:
                  number: 8080
