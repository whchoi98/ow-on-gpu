# BFF용 Graviton NodePool. Karpenter가 arm64 On-Demand 노드를 만든다.
# - BFF 이미지는 arm64로 빌드한다(app/bff/build.sh). Fargate에서도 ARM64였다.
# - taint로 다른 파드를 막는다. BFF 파드만 이 taint를 허용한다.
# - 2 vCPU로 묶는다. 조회 시점(2026-11-15)에 서울의 가장 싼 후보는 c7g.large(시간당 0.0816달러)이고 네 AZ에서 모두 제공된다.
# - limits는 노드가 의도와 다르게 늘지 않게 하는 상한이다. 파드 2개를 AZ 두 곳에 나누면 노드 2대(4 vCPU)다.
# - EC2NodeClass는 system과 같은 것을 쓴다. AMI 별칭은 인스턴스의 아키텍처에 맞는 변형을 고른다.
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: app
spec:
  template:
    spec:
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: system
      requirements:
        - key: kubernetes.io/arch
          operator: In
          values: ["arm64"]
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["on-demand"]
        - key: karpenter.k8s.aws/instance-category
          operator: In
          values: ["c", "m"]
        - key: karpenter.k8s.aws/instance-generation
          operator: Gt
          values: ["6"]
        - key: karpenter.k8s.aws/instance-cpu
          operator: In
          values: ["2"]
      taints:
        - key: ow-on-gpu/app
          value: "true"
          effect: NoSchedule
  limits:
    cpu: "8"
  disruption:
    consolidationPolicy: WhenEmpty
    consolidateAfter: 30m
