# infra/terraform/storage.tf가 이 ServiceAccount에 S3 읽기 전용 역할을 Pod Identity로 연결한다.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: gemma
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-gemma
  labels:
    app.kubernetes.io/name: vllm-gemma
spec:
  replicas: 1
  # startupProbe가 기다리는 최대 시간과 맞춘다. 기본값 600초는 콜드 스타트보다 짧을 수 있다.
  progressDeadlineSeconds: 1800
  # GPU 1장에 파드 1개이므로 새 파드를 띄우기 전에 기존 파드를 내린다.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: vllm-gemma
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vllm-gemma
    spec:
      serviceAccountName: gemma
      automountServiceAccountToken: false
      nodeSelector:
        karpenter.sh/nodepool: gemma-od
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      terminationGracePeriodSeconds: 60
      initContainers:
        # 노드에 이미 있는 vLLM 이미지를 써서 이미지 pull을 늘리지 않는다.
        - name: cache-restore
          image: vllm/vllm-openai:v0.33.0
          command: ["python3", "/scripts/cache-restore.py"]
          env:
            - name: MODEL_BUCKET
              valueFrom:
                configMapKeyRef: {name: platform, key: MODEL_BUCKET}
            - name: AWS_DEFAULT_REGION
              valueFrom:
                configMapKeyRef: {name: platform, key: AWS_REGION}
            - name: CACHE_PREFIX
              value: vllm-cache/v0.33.0-gemma4-31b-fp8-l40s
          volumeMounts:
            - name: vllm-cache
              mountPath: /vllm-cache
            - name: scripts
              mountPath: /scripts
              readOnly: true
      containers:
        - name: vllm
          image: vllm/vllm-openai:v0.33.0
          # 이미지의 ENTRYPOINT가 `vllm serve`다.
          args:
            - s3://$(MODEL_BUCKET)/models/gemma-4-31B-it-FP8-dynamic
            - --served-model-name=gemma-4-31b
            - --load-format=runai_streamer
            - --language-model-only
            - --max-model-len=16384
            - --kv-cache-dtype=fp8
            # sleep mode를 쓰지 않으므로 0.85보다 높게 시험한다. 시작하지 못하면 0.85로 낮춘다.
            - --gpu-memory-utilization=0.90
            - --enable-prefix-caching
            - --scheduling-policy=priority
            - --enable-auto-tool-choice
            - --tool-call-parser=gemma4
            - --reasoning-parser=gemma4
          env:
            - name: MODEL_BUCKET
              valueFrom:
                configMapKeyRef: {name: platform, key: MODEL_BUCKET}
            - name: AWS_DEFAULT_REGION
              valueFrom:
                configMapKeyRef: {name: platform, key: AWS_REGION}
            - name: VLLM_CACHE_ROOT
              value: /vllm-cache
            # runai-model-streamer는 기본값으로 C++ 계층이 자격 증명을 찾는다. EKS Pod Identity를
            # 확실히 쓰도록 boto3가 자격 증명을 받아 넘기게 한다.
            - name: RUNAI_STREAMER_NO_BOTO3_SESSION
              value: "0"
            # 서빙 파드가 Hugging Face에서 내려받으려 하면 실패하게 한다.
            - name: HF_HUB_OFFLINE
              value: "1"
          ports:
            - name: http
              containerPort: 8000
          resources:
            requests:
              cpu: "12"
              memory: 64Gi
            limits:
              memory: 110Gi
              nvidia.com/gpu: 1
          # Ready 시각을 1초 단위로 잡기 위해 시작 확인 주기를 1초로 둔다. 최대 30분을 기다린다.
          startupProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 1
            failureThreshold: 1800
          readinessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 2
          livenessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 10
            failureThreshold: 3
          volumeMounts:
            - name: vllm-cache
              mountPath: /vllm-cache
            - name: shm
              mountPath: /dev/shm
      volumes:
        - name: vllm-cache
          hostPath:
            path: /var/cache/vllm
            type: DirectoryOrCreate
        - name: scripts
          configMap:
            name: vllm-cache-restore
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 8Gi
