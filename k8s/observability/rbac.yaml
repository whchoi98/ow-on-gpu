# infra/terraform/observability.tf가 이 ServiceAccount에 aps:RemoteWrite 역할을 Pod Identity로 연결한다.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: metrics-collector
  namespace: monitoring
---
# inference 네임스페이스의 파드를 찾는 권한만 준다.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: metrics-collector
  namespace: inference
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: metrics-collector
  namespace: inference
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: metrics-collector
subjects:
  - kind: ServiceAccount
    name: metrics-collector
    namespace: monitoring
---
# EPP의 /metrics는 토큰을 요구한다(인증 없이 401, 2026-11-14 확인). EPP는 TokenReview로 토큰을 확인한 뒤
# 이 비리소스 경로의 get 권한을 SubjectAccessReview로 묻는다.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ow-on-gpu-metrics-reader
rules:
  - nonResourceURLs: ["/metrics"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ow-on-gpu-metrics-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ow-on-gpu-metrics-reader
subjects:
  - kind: ServiceAccount
    name: metrics-collector
    namespace: monitoring
