apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: model-jobs

resources:
  - job.yaml

configMapGenerator:
  - name: model-sync-config
    files:
      - sync.py
      - models.json
  # BUCKET은 infra/terraform의 model_bucket 출력값과 맞춘다.
  - name: model-sync-params
    envs:
      - params.env
