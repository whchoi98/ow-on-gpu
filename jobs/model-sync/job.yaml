# infra/terraform/storage.tf가 이 ServiceAccount에 쓰기 역할을 Pod Identity로 연결한다.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: model-sync
automountServiceAccountToken: false
---
apiVersion: batch/v1
kind: Job
metadata:
  name: model-sync
spec:
  # 다시 뜬 파드는 이미 올라간 파일을 건너뛰므로 재시도 비용이 작다.
  backoffLimit: 2
  activeDeadlineSeconds: 7200
  template:
    spec:
      serviceAccountName: model-sync
      automountServiceAccountToken: false
      restartPolicy: Never
      nodeSelector:
        karpenter.sh/nodepool: system
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: sync
          image: public.ecr.aws/docker/library/python:3.13-slim@sha256:e48f59cdba69a3cbd9ed2cf0f348d90d45a8d350d98134cf1070bc106ee9ed90
          command: ["python3", "/config/sync.py"]
          envFrom:
            - configMapRef:
                name: model-sync-params
          resources:
            # 파일 8개를 동시에 받으며 해시 계산, TLS, 멀티파트 업로드를 함께 한다.
            # system NodePool은 4 또는 8 vCPU만 허용하므로 6을 요청하면 8 vCPU 인스턴스가 뜬다.
            requests:
              cpu: "6"
              memory: 4Gi
            limits:
              memory: 4Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: model-sync-config
        - name: tmp
          emptyDir: {}
