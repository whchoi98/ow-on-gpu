<title id="part1-fig01-title">시리즈 전체 구성: 요청 경로와 모델, 이미지가 GPU 노드에 올라가는 경로</title>
<desc id="part1-fig01-desc">서울 리전 VPC의 Amazon EKS 클러스터에서 Karpenter가 만든 GPU 노드 세 대가 Gemma 4 31B, Qwen3.8-27B, Strands Decider 2B를 서빙한다. 요청은 CloudFront와 내부 ALB를 지나 클러스터 안의 BFF 파드와 게이트웨이를 거쳐 들어오고, 가중치와 compile 캐시는 Amazon S3 버킷에서, 컨테이너 이미지는 Docker Hub에서 GPU 노드로 올라간다</desc>
