<title id="p2-fig03-title">측정 구성: 측정 Job에서 vLLM Service로, 지표는 Prometheus agent에서 Amazon Managed Service for Prometheus로</title>
<desc id="p2-fig03-desc">서울 리전의 Amazon EKS 클러스터에서 측정 전용 노드(c7i-flex.2xlarge)의 측정 Job이 게이트웨이를 거치지 않고 g6e.4xlarge 두 대의 vLLM 파드(Gemma 4 31B, Qwen3.8-27B)를 Service로 직접 호출하고, system 노드의 Prometheus agent가 두 파드의 /metrics를 5초마다 수집해 Amazon Managed Service for Prometheus로 remote write하는 구성</desc>
