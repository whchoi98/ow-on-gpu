<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-labelledby="p2-fig03-title p2-fig03-desc">
<title id="p2-fig03-title">S1에서 동시성에 따른 출력 처리량과 ITL p99</title>
<desc id="p2-fig03-desc">S1 짧은 채팅에서 동시성을 1에서 64까지 올리면 Gemma 4 31B의 출력 처리량은 18.5에서 447.0 tok/s까지 늘고 Qwen3.8-27B(MTP 켬)는 동시성 8 이후 85.0에서 91.2 tok/s에 머문다. ITL p99는 동시성 1에서 Gemma 57.7ms, Qwen 74.3ms로 두 모델 모두 기준 50ms를 넘는다</desc>
