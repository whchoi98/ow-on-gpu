<title id="2026-11-15-eks-vllm-two-models-part3-fig01-title">요청 경로와 접근 제한</title>
<desc id="2026-11-15-eks-vllm-two-models-part3-fig01-desc">사용자의 요청이 CloudFront와 AWS WAF, VPC origin, 내부 ALB를 지나 Amazon EKS 클러스터 안의 BFF 파드, agentgateway, 모델별 EPP를 거쳐 Gemma 4 31B와 Qwen3.8-27B의 vLLM 파드에 도달하고, BFF 파드가 게이트웨이와 깨우기 API를 클러스터 안의 Service로 호출하며, 배치 작업은 게이트웨이의 내부 NLB로 들어오는 경로를 나타낸 아키텍처 그림</desc>
